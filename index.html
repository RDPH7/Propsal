<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Promises for You 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  height:100vh;
  background:linear-gradient(135deg,#ffdde1,#ee9ca7);
  font-family:'Montserrat','Poppins',sans-serif;
  overflow:hidden;
}

/* Entry & Last */
.entry,.last{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  color:white;
  padding:20px;
  z-index:5;
}

/* Entry */
.entry h1{font-size:28px;margin:6px 0;}
.entry p{font-size:18px;margin-bottom:20px;}
.entry button{
  padding:12px 34px;
  border:none;
  border-radius:30px;
  font-size:16px;
  cursor:pointer;
  background:white;
  color:#e63946;
  font-weight:600;
}

/* Card */
.story{
  width:100%;
  max-width:420px;
  height:100vh;
  margin:auto;
  display:flex;
  justify-content:center;
  align-items:center;
}

.card{
  background:#fff;
  width:90%;
  padding:25px;
  border-radius:24px;
  text-align:center;
  box-shadow:0 20px 40px rgba(0,0,0,0.25);
  animation:heartbeat 2s infinite;
  display:none;
}

@keyframes heartbeat{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.04);}
}

h2{color:#e63946;margin-bottom:15px;}

.promise-text{
  font-size:16px;
  line-height:1.6;
  min-height:180px;
  margin-bottom:20px;
  white-space:pre-line;
}

button{
  padding:12px 26px;
  border:none;
  border-radius:30px;
  font-size:15px;
  cursor:pointer;
  margin:6px;
}

.yes{background:#38b000;color:#fff;}
.no{background:#adb5bd;position:relative;}

.music-btn{
  background:#ff4d6d;
  color:white;
  font-weight:600;
}

footer{margin-top:15px;font-size:12px;color:#777;}

/* Last Page */
.last{display:none;}
.last h1{font-size:26px;margin-bottom:15px;}
.last p{font-size:17px;line-height:1.6;max-width:330px;}

/* Hearts */
.heart{
  position:absolute;
  color:#ff4d6d;
  font-size:18px;
  animation:float 6s linear infinite;
  opacity:0.7;
}

@keyframes float{
  0%{transform:translateY(0);opacity:0;}
  10%{opacity:0.8;}
  100%{transform:translateY(-100vh);opacity:0;}
}
</style>
</head>

<body>

<!-- ENTRY -->
<div class="entry" id="entry">
  <h1>Hey Madam ji 💖</h1>
  <p>Promises for you</p>
  <button onclick="openPromise()">Open 💌</button>
</div>

<!-- PROMISE PAGE -->
<div class="story">
  <div class="card" id="card">
    <h2>💌 Hoii Mrs Aadu Tripathy</h2>

    <div class="promise-text" id="promise"></div>

    <button class="music-btn" onclick="playMusic()">🎵 Play Music</button><br>

    <button class="yes" onclick="showLast()">Main waada accept krti hu ❤️</button>
    <button class="no" id="noBtn">Nahi 🙃</button>

    <footer>— Aditya Sinha</footer>
  </div>
</div>

<!-- LAST PAGE -->
<div class="last" id="last">
  <h1>❤️ I love you Mrs Aditya Sinha</h1>
  <p>
    (Sanjita Tripathy) <br><br>
    Thank you so much mere life main aane ko.  
    Hope tum muje permanent accept kro 💖
  </p>
</div>

<!-- AUDIO -->
<audio id="bgMusic" loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<script>
/* Entry */
function openPromise(){
  document.getElementById("entry").style.display="none";
  document.getElementById("card").style.display="block";
  startTyping();
}

/* Typing */
const text = `Hoii Mrs Aadu Tripathy 💖,

Main, Aditya Sinha, yeh wada karta hoon ki—

1. Main tumhari soch, tumhari feelings aur tumhari boundaries ka
   hamesha samman karunga, chahe hum disagree hi kyun na karein.

2. Main wada karta hoon ki imaandari se baat karunga.

3. Main tumhare sapno aur growth ko support karunga.

4. Main patience rakhunga,
   kyunki relationship waqt ke saath strong hota hai.

Yeh wada dil se hai —
sirf tumhare liye. 💖`;

let i=0;
function startTyping(){
  const p=document.getElementById("promise");
  const t=setInterval(()=>{
    p.innerHTML+=text.charAt(i);
    i++;
    if(i>=text.length) clearInterval(t);
  },35);
}

/* Music */
function playMusic(){
  const m=document.getElementById("bgMusic");
  m.volume=0.75;   // medium–high
  m.play();
}

/* Accept */
function showLast(){
  document.getElementById("card").style.display="none";
  document.getElementById("last").style.display="flex";
}

/* No button */
const noBtn=document.getElementById("noBtn");
noBtn.onmouseover=()=>{
  noBtn.style.left=Math.random()*120-60+"px";
  noBtn.style.top=Math.random()*80-40+"px";
};

/* Hearts */
setInterval(()=>{
  const heart=document.createElement("div");
  heart.className="heart";
  heart.innerHTML="❤";
  heart.style.left=Math.random()*100+"vw";
  heart.style.fontSize=Math.random()*20+10+"px";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),6000);
},500);
</script>

</body>
</html>
